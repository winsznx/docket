<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Flutter replaces $FLUTTER_BASE_HREF with the value of the `--base-href`
    argument to `flutter build`. It has to start and end with a slash.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your place in the clinic line, live on your phone.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1440" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Docket">
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Docket</title>

  <!--
    The splash paints before Flutter loads. Its values come from
    design/tokens.json, written out here because the app doesn't load the
    site's CSS. It uses installed or system fonts so it paints at once.
  -->
  <style>
    html,
    body {
      margin: 0;
      min-block-size: 100%;
      background: #FFFFFF;
      color: #182C70;
    }

    #splash {
      position: fixed;
      inset: 0;
      box-sizing: border-box;
      padding-block: 1.5rem;
      padding-inline: clamp(1rem, 4vw, 4rem);
      font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif;
    }

    #splash .wordmark {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0;
      font-size: 1.375rem;
      font-weight: 800;
      line-height: 1.25;
    }

    #splash .wordmark svg {
      inline-size: 1.5em;
      block-size: 1em;
      fill: #FFC928;
    }

    #splash .line {
      position: absolute;
      inset-block-start: 0;
      inset-inline: 0;
      block-size: 2px;
      overflow: hidden;
      color: #182C70;
    }

    #splash .line::before {
      content: "";
      position: absolute;
      inset-block: 0;
      inset-inline-start: 0;
      inline-size: 33.333%;
      background: currentColor;
      transform: translateX(-100%);
      animation: splash-travel 2400ms cubic-bezier(0.2, 0.7, 0.2, 1) infinite;
    }

    @keyframes splash-travel {
      to {
        transform: translateX(300%);
      }
    }

    #fp-label {
      margin: 3rem 0 0;
      font-size: clamp(6rem, 25vw, 8rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    #fp-detail {
      margin: 1.5rem 0 0;
      max-inline-size: 34rem;
      font-size: clamp(1.25rem, 1.1rem + 0.6vw, 1.625rem);
      line-height: 1.45;
      text-wrap: pretty;
    }

    #fp-label:empty,
    #fp-detail:empty {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      html,
      body {
        background: #0B1440;
        color: #FFFFFF;
      }

      #splash .line {
        color: #A9B3D6;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash .line::before {
        animation: none;
        transform: translateX(100%);
      }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="line" role="progressbar" aria-label="Loading Docket"></div>
    <p class="wordmark">
      <svg viewBox="0 0 48 32" aria-hidden="true" focusable="false">
        <path d="M6 0H42A6 6 0 0 1 48 6V11A5 5 0 0 0 48 21V26A6 6 0 0 1 42 32H6A6 6 0 0 1 0 26V21A5 5 0 0 0 0 11V6A6 6 0 0 1 6 0Z"/>
      </svg>
      Docket
    </p>
    <p id="fp-label"></p>
    <p id="fp-detail"></p>
  </div>

  <!--
    First paint for a patient ticket, before Flutter boots. It writes only
    text, so nothing from the response is parsed as markup.
  -->
  <script>
    (function () {
      var match = /^\/t\/([A-Za-z0-9_-]+)$/.exec(location.pathname);
      if (!match) return;

      fetch('/api/t/' + match[1], {
        cache: 'no-store',
        headers: { Accept: 'application/json' }
      })
        .then(function (response) {
          return response.ok ? response.json() : null;
        })
        .then(function (data) {
          if (!data) return;
          var label = document.getElementById('fp-label');
          var detail = document.getElementById('fp-detail');
          if (label && typeof data.label === 'string') {
            label.textContent = data.label;
          }
          if (detail && typeof data.detail === 'string') {
            detail.textContent = data.detail;
          }
        })
        .catch(function (error) {
          console.warn('Ticket first paint skipped, Flutter will show it.', error);
        });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
